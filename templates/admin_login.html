{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h1>ورود مدیر</h1>
    <form method="POST">
        <input type="password" name="password" placeholder="رمز عبور را وارد کنید" required>
        <button type="submit" class="button">ورود</button>
    </form>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <p style="color: red;">{{ messages[0] }}</p>
      {% endif %}
    {% endwith %}
</div>
{% endblock %}
